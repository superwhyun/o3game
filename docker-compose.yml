services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: ogame-mongo
    command: ["mongod", "--replSet", "oogame", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cosmic_empire
    networks:
      - ogame-network

  # Redis (필요시 사용)
  redis:
    image: redis:7-alpine
    container_name: ogame-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ogame-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ogame-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3999}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/cosmic_empire?replicaSet=oogame&directConnection=true
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a non-default value of at least 32 characters}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:${CLIENT_PORT:-5173}}
      - AI_WORKER_SECRET=${AI_WORKER_SECRET:-}
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - ogame-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm ci --include=dev && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  # External-model AI: HTTP API only, no DB or administrator credentials.
  ai-player:
    image: node:22-alpine
    container_name: ogame-ai-player
    command: node index.js
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./ai-player:/app:ro
    environment:
      - GAME_API_URL=http://server:3000
      - AI_WORKER_SECRET=${AI_WORKER_SECRET:-}
    depends_on:
      - server
    networks:
      - ogame-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (Vite dev server)
  client:
    image: node:22-alpine
    container_name: ogame-client
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./ogame-3d:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_SERVER_URL=
      - SERVER_PROXY_TARGET=http://server:3000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    depends_on:
      - server
    networks:
      - ogame-network

volumes:
  mongo_data:

networks:
  ogame-network:
    driver: bridge
